<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Tetravex</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #222;
    }
    canvas {
      display: block;
      touch-action: none; /* le glisser-déposer au doigt ne fait pas défiler la page */
    }
    #buttons {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    #buttons button {
      padding: 8px 20px;
      font: bold 18px sans-serif;
      color: #111;
      background: #2fd0ff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #buttons select {
      padding: 8px;
      font: bold 18px sans-serif;
      border-radius: 6px;
    }
    #buttons button.active {
      background: #ffe650;
    }
    #buttons button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #buttons button:hover:not(:disabled):not(.active) {
      background: #7fe3ff;
    }
    #options {
      position: relative;
      font: bold 18px sans-serif;
    }
    #options summary {
      list-style: none;
      padding: 8px 20px;
      color: #111;
      background: #2fd0ff;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }
    #options summary::-webkit-details-marker {
      display: none;
    }
    #options[open] summary {
      background: #ffe650;
    }
    #options .panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 18px;
      background: #333;
      color: #eee;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      font-weight: normal;
      z-index: 1;
    }
    #options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    #options input {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="buttons">
    <select id="mode" title="Mode de jeu">
      <option value="3" selected>3 faces</option>
      <option value="6">6 faces (2 vues)</option>
    </select>
    <select id="size" title="Taille d'une face du cube">
      <option value="1">1x1</option>
      <option value="2">2x2</option>
      <option value="3" selected>3x3</option>
      <option value="4">4x4</option>
    </select>
    <button id="new-game">Nouvelle partie</button>
    <button id="hint">Indice</button>
    <button id="transparency" title="Voir le cube entier en transparence (6 faces)">Transparence</button>
    <details id="options">
      <summary>Options</summary>
      <div class="panel">
        <label><input type="checkbox" data-option="hoverLinks"> Voisines au survol</label>
        <label><input type="checkbox" data-option="validTargets"> Placements possibles</label>
        <label><input type="checkbox" data-option="ghostNeighbors"> Tuiles voisines en bordure</label>
      </div>
    </details>
  </div>
  <script src="script.js"></script>
</body>
</html>
